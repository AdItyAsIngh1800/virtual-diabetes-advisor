[project]
name = "diabetes-advisor"
version = "0.1.0"
description = "Virtual diabetes advisor: personal thresholds, pre-breach web-push voice alerts, two-way help, audited conversations, dashboard."
requires-python = ">=3.11"
dependencies = [
    # API + jobs
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    # Data / ML
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "statsmodels>=0.14",  # trend analysis (R2 revision)
    # Storage
    "supabase>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Notifications (Web Push) + voice
    "gtts>=2.5",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "anthropic>=2.8.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
    "types-requests",
    "jupyter>=1.1",
    "pytest-timeout>=2.3",
]
# Imports of notebooks/01_brfss_risk_model.ipynb that the app itself does not need.
# Install with: uv sync --group notebook
notebook = [
    "matplotlib>=3.9",
    "pillow>=10",  # matplotlib needs it to draw some figures
    "scipy>=1.13",  # also pulled in by scikit-learn; declared because the notebook imports it
]

# ---------------------------------------------------------------------------
# Ruff: enforces docstrings (D), type annotations (ANN) and general quality.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "ANN", "S", "PL", "RUF"]
ignore = ["D105", "D107", "PLR0913", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PLR2004"]

# ---------------------------------------------------------------------------
# Mypy: strict type checking for app code.
# ---------------------------------------------------------------------------
[tool.mypy]
# No python_version pin: numpy 2.x stubs need 3.12+ syntax, so check with the venv's Python.
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["notebooks/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "gtts.*", "faster_whisper.*", "apscheduler.*", "pywebpush.*", "py_vapid.*", "http_ece.*", "joblib.*", "statsmodels.*", "sklearn.*", "supabase.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-timeout: fail any single test that runs longer than 120 s instead of hanging
# the whole run (a silently dropped database connection did, twice, in Nov 2026).
# The slowest real test (a live seed-and-batch round trip) takes about 27 s.
timeout = 120
addopts = "-q --cov=app --cov-report=term-missing"
