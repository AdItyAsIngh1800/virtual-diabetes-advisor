<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Practitioner Inbox</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon-192.png">
  <link rel="apple-touch-icon" href="/app/icon-192.png">
  <style>
    :root { --fg: #10221f; --muted: #52635f; --bg: #f5f8f7; --card: #fff; --accent: #0f766e; --err: #b42318;
            --pt: #eef3f2; --bot: #f7f7f2; --me: #0f766e; --me-fg: #fff; --urgent: #b42318; --urgent-bg: #fdecea; --line: #d9e2e0; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e7efed; --muted: #a3b5b1; --bg: #0d1513; --card: #15211e; --accent: #2bb3a3; --err: #f97066;
              --pt: #1d2b28; --bot: #1a2220; --me: #1d8c80; --me-fg: #fff; --urgent: #f97066; --urgent-bg: #2d1614; --line: #26332f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 60rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    section, .panel { background: var(--card); border-radius: 12px; padding: 1rem; margin-top: 1rem;
              box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
    label { display: block; font-size: .9rem; margin-top: .5rem; }
    input, textarea { width: 100%; font: inherit; padding: .6rem; border: 1px solid var(--muted); border-radius: 8px;
            background: transparent; color: inherit; }
    button { font: inherit; font-weight: 600; padding: .6rem 1rem; border-radius: 8px; border: 0; margin: .5rem .5rem 0 0;
             background: var(--accent); color: #fff; cursor: pointer; min-height: 44px; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 1.5em; }
    #status.error { color: var(--err); }
    .layout { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 52rem) { .layout { grid-template-columns: 20rem 1fr; align-items: start; } }
    #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
    #list button { width: 100%; margin: 0; text-align: left; background: transparent; color: inherit;
                   border: 1px solid var(--line); display: block; font-weight: 400; }
    #list button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
    #list .name { font-weight: 700; }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
           padding: .1rem .45rem; border-radius: 999px; background: var(--pt); margin-right: .3rem; }
    .tag.urgent { color: var(--urgent); background: var(--urgent-bg); }
    #messages { display: flex; flex-direction: column; gap: .5rem; max-height: 55vh; overflow-y: auto; padding: .25rem; }
    .bubble { max-width: 85%; padding: .55rem .75rem; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bubble.patient { align-self: flex-start; background: var(--pt); border-bottom-left-radius: 4px; }
    .bubble.assistant { align-self: flex-start; background: var(--bot); color: var(--muted); font-size: .9rem; border: 1px dashed var(--line); }
    .bubble.practitioner { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 4px; }
    .bubble .who { display: block; font-size: .75rem; font-weight: 700; opacity: .8; }
    .bubble .meta { display: block; font-size: .72rem; opacity: .75; margin-top: .2rem; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; }
    /* Day separator ("Today", "Yesterday", "16 Nov") and system notices ("... has joined"). */
    .day { align-self: center; font-size: .75rem; font-weight: 600; color: var(--muted); padding: .15rem .6rem; border-radius: 999px; border: 1px solid var(--line); margin: .25rem 0; }
    .notice { align-self: center; font-size: .8rem; font-style: italic; color: var(--muted); text-align: center; }
    #claim-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .5rem .75rem; border-radius: 10px; background: var(--pt); margin-bottom: .5rem; }
    #claim-bar p { margin: 0; flex: 1 1 14rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Practitioner inbox</h1>
  <p class="muted">Patients who asked for help. You only see patients assigned to you.</p>

  <section id="signed-out" hidden>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <section id="signed-in" hidden>
    <div class="actions">
      <span>Signed in as <strong id="who"></strong></span>
    </div>
    <div class="actions">
      <button id="enable">Enable alerts</button>
      <button id="refresh" class="secondary">Refresh</button>
      <button id="signout" class="secondary">Sign out</button>
    </div>
    <p class="muted">Enable alerts to get a notification when a patient asks for help. On iPhone, add this page to the Home Screen first.</p>
  </section>

  <div class="layout" id="inbox" hidden>
    <div class="panel">
      <h2>Handoffs</h2>
      <ul id="list" aria-label="Handoffs"></ul>
      <p id="empty" class="muted" hidden>No open handoffs.</p>
    </div>
    <div class="panel" id="thread" hidden>
      <h2 id="thread-title"></h2>
      <p id="thread-meta" class="muted"></p>
      <div id="claim-bar" role="status">
        <p id="claim-status"></p>
        <button type="button" id="claim" hidden>Claim</button>
      </div>
      <div id="messages" aria-live="polite" aria-label="Conversation"></div>
      <form id="reply-form">
        <label for="reply">Reply to the patient</label>
        <textarea id="reply" rows="3" maxlength="2000" required></textarea>
        <div class="actions">
          <button type="submit" id="send">Send reply</button>
          <button type="button" id="resolve" class="secondary">Resolve</button>
        </div>
      </form>
      <p id="resolved-note" class="muted" hidden>This handoff is resolved.</p>
    </div>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/app/common.js"></script>
<script src="/app/practitioner.js"></script>
</body>
</html>
