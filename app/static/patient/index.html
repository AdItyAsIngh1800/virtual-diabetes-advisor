<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diabetes Advisor</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon-192.png">
  <link rel="apple-touch-icon" href="/app/icon-192.png">
  <style>
    :root { --fg: #10221f; --muted: #52635f; --bg: #f5f8f7; --card: #fff; --accent: #0f766e; --err: #b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e7efed; --muted: #a3b5b1; --bg: #0d1513; --card: #15211e; --accent: #2bb3a3; --err: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 28rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p { margin: .5rem 0; }
    .muted { color: var(--muted); font-size: .9rem; }
    section { background: var(--card); border-radius: 12px; padding: 1rem; margin-top: 1rem;
              box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
    label { display: block; font-size: .9rem; margin-top: .5rem; }
    input { width: 100%; font: inherit; padding: .6rem; border: 1px solid var(--muted); border-radius: 8px;
            background: transparent; color: inherit; }
    button { font: inherit; font-weight: 600; padding: .7rem 1rem; border-radius: 8px; border: 0; margin: .75rem .5rem 0 0;
             background: var(--accent); color: #fff; cursor: pointer; min-height: 44px; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    .alert { border-left: 5px solid var(--accent); }
    a.button { display: inline-block; font-weight: 600; padding: .7rem 1rem; border-radius: 8px; margin-top: .5rem;
               background: var(--accent); color: #fff; text-decoration: none; min-height: 44px; }
    #status { min-height: 1.5em; }
    #status.error { color: var(--err); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Diabetes Advisor</h1>
  <p class="muted">Test page for glucose alerts on this device.</p>

  <section id="new-advisory" class="alert" role="alert" hidden>
    <strong id="new-advisory-title">New glucose advice</strong>
    <p class="muted">A new advisory just arrived for you.</p>
    <a id="new-advisory-link" class="button" href="/app/">Open advice</a>
  </section>

  <section id="signed-out" hidden>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      <button type="submit">Sign in</button>
      <button type="button" class="secondary" id="signup">Create account</button>
    </form>
  </section>

  <section id="signed-in" hidden>
    <p>Signed in as <strong id="who"></strong></p>
    <button id="enable">Enable alerts</button>
    <button id="disable" class="secondary">Turn alerts off</button>
    <button id="signout" class="secondary">Sign out</button>
    <p class="muted">On iPhone, first use Share &rarr; Add to Home Screen, then open the app from the home screen.</p>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
