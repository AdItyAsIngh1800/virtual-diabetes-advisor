<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your glucose advice</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon-192.png">
  <link rel="apple-touch-icon" href="/app/icon-192.png">
  <style>
    :root {
      --fg: #10221f; --muted: #52635f; --bg: #f5f8f7; --card: #fff; --accent: #0f766e;
      --warn: #a15c07; --warn-bg: #fff6e5; --bad: #b42318; --bad-bg: #fdecea; --err: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e7efed; --muted: #a3b5b1; --bg: #0d1513; --card: #15211e; --accent: #2bb3a3;
        --warn: #f5b759; --warn-bg: #2b2213; --bad: #f97066; --bad-bg: #2d1614; --err: #f97066;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    a { color: var(--accent); }
    .muted { color: var(--muted); font-size: .9rem; }
    .card { background: var(--card); border-radius: 14px; padding: 1rem; margin-top: 1rem;
            box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
    .badge { display: inline-block; font-size: .8rem; font-weight: 700; letter-spacing: .02em;
             text-transform: uppercase; padding: .2rem .55rem; border-radius: 999px; }
    .tone-warn .badge { color: var(--warn); background: var(--warn-bg); }
    .tone-bad .badge { color: var(--bad); background: var(--bad-bg); }
    h1 { font-size: 1.35rem; margin: .5rem 0 0; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 1rem; }
    .stat { background: var(--bg); border-radius: 10px; padding: .75rem; }
    .stat .label { font-size: .85rem; color: var(--muted); }
    .stat .value { font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat .unit { font-size: .85rem; color: var(--muted); }
    .tone-warn .reading .value { color: var(--warn); }
    .tone-bad .reading .value { color: var(--bad); }
    #message { font-size: 1.05rem; margin: 0; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer; width: 100%; }
    #play { background: var(--accent); color: #fff; font-size: 1.25rem; min-height: 64px; margin-top: 1rem;
            display: flex; align-items: center; justify-content: center; gap: .6rem; }
    #play svg { width: 1.4rem; height: 1.4rem; fill: currentColor; }
    #doctor { background: transparent; color: var(--accent); border: 2px solid var(--accent);
              min-height: 52px; margin-top: .75rem; }
    button:disabled { opacity: .45; cursor: default; }
    .urgent { border-left: 5px solid var(--bad); }
    .urgent strong { color: var(--bad); }
    #status { min-height: 1.5em; margin-top: .75rem; }
    #status.error { color: var(--err); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <a href="/app/">&larr; Diabetes Advisor</a>

  <p id="loading" class="muted">Loading your advice&hellip;</p>

  <article id="advisory" hidden>
    <section class="card" id="summary">
      <span class="badge" id="badge"></span>
      <h1 id="headline"></h1>
      <div class="stats">
        <div class="stat reading">
          <div class="label" id="reading-label">Your reading</div>
          <div class="value" id="reading"></div>
          <div class="unit">mg/dL</div>
        </div>
        <div class="stat">
          <div class="label" id="limit-label">Your limit</div>
          <div class="value" id="limit"></div>
          <div class="unit">mg/dL</div>
        </div>
      </div>
      <p class="muted" id="measured"></p>
    </section>

    <section class="card urgent" id="urgent" hidden>
      <strong>This is a very low reading.</strong>
      If you feel unwell, confused or faint, call emergency services now.
    </section>

    <section class="card">
      <p id="message"></p>
      <button id="play" type="button" aria-describedby="message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span id="play-label">Play voice advice</span>
      </button>
      <audio id="audio" preload="none"></audio>
      <button id="doctor" type="button" disabled>Talk to a doctor</button>
      <p class="muted">Talking to a doctor from the app is coming soon. Until then, contact your doctor directly.</p>
    </section>
  </article>

  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/app/advisory.js"></script>
</body>
</html>
